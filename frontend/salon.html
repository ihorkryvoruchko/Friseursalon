<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon-Bereich · Tagesübersicht</title>
  <link rel="stylesheet" href="assets/css/salon.css">
  <link rel="stylesheet" href="assets/css/menu.css">
</head>
<body>
  <main class="container">
    <header class="top-bar">
      <h1 id="current-date-title"></h1>
      <nav>
        <ul id="horizontales-menu">
          <li><a href="index.html">Buchen</a></li>
          <li><a href="salon.html">Salon Bereich</a></li>
        </ul>
      </nav>
      <div class="nav-buttons">
        <button type="button" id="prev-day-btn" class="btn">&lt; Zurück</button>
        <button type="button" id="today-btn" class="btn">Heute</button>
        <button type="button" id="next-day-btn" class="btn">Weiter &gt;</button>
      </div>
    </header>

    <section class="schedule-card">
      <div id="schedule-container" class="table-wrap"></div>

      <div class="legend">
        <span class="legend-item">
          <i class="dot status-booked"></i> gebucht
        </span>
        <span class="legend-item">
          <i class="dot status-done"></i> erledigt
        </span>
        <span class="legend-item">
          <i class="dot status-cancelled"></i> storniert
        </span>
      </div>
    </section>
  </main>

  <script type="module" src="assets/js/salon/salon-main.js"></script>
</body>
</html>
